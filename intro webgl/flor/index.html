<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FLOR - CELINE </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #111827;

            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            margin-bottom: 15px;

            color: white;
            font-size: 28px;
            font-weight: 600;
        }

        canvas {
            display: block;

            width: 700px;
            height: 700px;

            max-width: 90vw;
            max-height: 80vh;

            background: #172033;

            border: 2px solid #374151;
            border-radius: 12px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }

        p {
            margin-top: 15px;

            color: #9ca3af;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>FLOR - CELINE</h1>

        <canvas id="glCanvas" width="700" height="700"></canvas>


    </div>

    <script src="main.js"></script>

</body>

</html>
