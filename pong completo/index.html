<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pong - Completo</title>
    <style>
        body {
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: monospace;
        }

        .game-container {
            position: relative;
            width: 600px;
            height: 600px;
        }

        canvas {
            border: 4px solid #fff;
            background-color: #000;
        }

        .scoreboard {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            font-size: 36px;
            font-weight: bold;
            pointer-events: none; 
        }

        .score-p1 {
            color: #00ff00; 
        }

        .score-p2 {
            color: #0088ff; 
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="scoreboard">
            <span id="score1" class="score-p1">0</span>
            <span id="score2" class="score-p2">0</span>
        </div>
        <canvas id="canvas" width="600" height="600"></canvas>
    </div>

    <script src="m3.js"></script>
    <script src="main.js"></script>

</body>
</html>
